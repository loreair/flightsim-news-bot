name: FlightSim News Bot

on:
  schedule:
    # Una volta a settimana: sabato alle 07:00 ora di Roma.
    # GitHub usa UTC: 05:00 UTC = 07:00 CEST (estate), 06:00 UTC = 07:00 CET (inverno).
    # Entrambi i cron sono attivi; lo step "Controllo ora locale" lascia passare solo quello giusto.
    - cron: '0 5 * * 6'
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Prova (attiva di default): invia al canale di prova (secret TEST_*) e non salva la cache. Togli la spunta SOLO per scrivere sul canale vero'
        type: boolean
        default: true
      ignora_cache:
        description: 'Reinvia anche le notizie già pubblicate (poi la cache viene aggiornata). Di solito lasciare spento'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Controllo ora locale (Europe/Rome)
      id: gate
      run: |
        OFFSET=$(TZ=Europe/Rome date +%z)
        echo "Evento: ${{ github.event_name }} | cron: ${{ github.event.schedule }} | offset Roma: $OFFSET"
        RUN=true
        if [ "${{ github.event_name }}" = "schedule" ]; then
          if [ "$OFFSET" = "+0200" ] && [ "${{ github.event.schedule }}" != "0 5 * * 6" ]; then RUN=false; fi
          if [ "$OFFSET" = "+0100" ] && [ "${{ github.event.schedule }}" != "0 6 * * 6" ]; then RUN=false; fi
        fi
        [ "$RUN" = "false" ] && echo "Cron non pertinente per l'ora legale/solare corrente, salto questo run."
        echo "run=$RUN" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v4
      if: steps.gate.outputs.run == 'true'

    - name: Setup Node.js 24
      if: steps.gate.outputs.run == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      if: steps.gate.outputs.run == 'true'
      run: npm install cheerio axios rss-parser @anthropic-ai/sdk

    # In modalità prova il bot non deve MAI ricadere sul canale vero: se i secret di prova
    # mancano, il run si ferma qui.
    - name: Controllo secret di prova
      if: steps.gate.outputs.run == 'true' && inputs.prova
      env:
        TEST_TOKEN: ${{ secrets.TEST_TELEGRAM_TOKEN }}
        TEST_CHAT: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
      run: |
        if [ -z "$TEST_TOKEN" ] || [ -z "$TEST_CHAT" ]; then
          echo "Mancano TEST_TELEGRAM_TOKEN o TEST_TELEGRAM_CHAT_ID: prova annullata per non scrivere sul canale vero."
          exit 1
        fi

    - name: Run bot
      if: steps.gate.outputs.run == 'true'
      env:
        TELEGRAM_TOKEN: ${{ inputs.prova && secrets.TEST_TELEGRAM_TOKEN || secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ inputs.prova && secrets.TEST_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        PROVA: ${{ inputs.prova && '1' || '0' }}
        IGNORA_CACHE: ${{ inputs.ignora_cache && '1' || '0' }}
      run: node bot.js

    - name: Salva cache sent_links nel repo
      if: steps.gate.outputs.run == 'true' && !inputs.prova
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_links.json
        git diff --cached --quiet && echo "Nessuna modifica alla cache, skip commit." && exit 0
        git commit -m "chore: update sent_links cache [skip ci]"
        git push origin main
